<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sweepFade" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="110" cy="110" r="95" fill="none" stroke="#334155" stroke-width="1"/>
  <circle cx="110" cy="110" r="70" fill="none" stroke="#334155" stroke-width="1"/>
  <circle cx="110" cy="110" r="45" fill="none" stroke="#334155" stroke-width="1"/>
  <circle cx="110" cy="110" r="20" fill="none" stroke="#334155" stroke-width="1"/>

  <line x1="15" y1="110" x2="205" y2="110" stroke="#334155" stroke-width="1"/>
  <line x1="110" y1="15" x2="110" y2="205" stroke="#334155" stroke-width="1"/>

  <g>
    <path d="M110,110 L110,15 A95,95 0 0,1 177.2,42.8 Z" fill="url(#sweepFade)"/>
    <line x1="110" y1="110" x2="110" y2="15" stroke="#22C55E" stroke-width="1.5"/>
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      from="0 110 110"
      to="360 110 110"
      dur="4s"
      repeatCount="indefinite"/>
  </g>

  <circle cx="140" cy="75" r="4" fill="#EF4444">
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="0.3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="70" cy="140" r="4" fill="#F59E0B">
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="2.1s" repeatCount="indefinite"/>
  </circle>

  <circle cx="150" cy="150" r="4" fill="#22C55E">
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="3.2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="110" cy="110" r="2.5" fill="#94A3B8"/>
</svg>
